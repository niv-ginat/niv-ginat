# ---------------------------------------------------------------
#  Site-wide settings. Change a value here and it updates
#  everywhere it appears across the site.
# ---------------------------------------------------------------
title: Niv Ginat
tagline: Product & Brand Design
description: >-
  Product and brand designer. Fifteen years designing the moments
  where people decide to commit.
url: https://nivginat.com

# --- contact + social: edit once, updates every page ---
author:
  name: Niv Ginat
  email: niv.ginat@gmail.com
  phone_display: "+1 818 726 9932"
  phone_href: "+18187269932"

social:
  behance: https://www.behance.net/nivginatc07e

# --- footer ---
copyright_start: 2019

# --- third-party versions, in one place ---
bootstrap_version: 5.3.3

# --- projects collection: keeps existing /projects/*.html URLs ---
collections:
  projects:
    output: true
    permalink: /projects/:name.html

defaults:
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }

# --- work-grid filter buttons ---
filters:
  - { label: All,       value: "*" }
  - { label: "Brand & Identity", value: ".branding" }
  - { label: Packaging, value: ".packaging" }
  - { label: Print,     value: ".print" }
  - { label: "Web & Product", value: ".ux_ui" }

# --- client strip --------------------------------------------------------
# Set as text for now; swap `name` for an `svg:` path per row when real
# marks arrive. The heading is deliberately separate from the list so the
# claim can be worded accurately — see clients_label.
# Ordered by how quickly a cold visitor recognises the name, not
# chronologically — the first two do the most work.
clients:
  - { name: "AT&T", logo: "att.svg" }
  - { name: "AMC", logo: "amc.svg" }
  - { name: "UCLA", logo: "ucla.svg" }
  - { name: "APM Music", logo: "apm-music.svg" }
  - { name: "Modern Life", logo: "modern-life.svg" }
  - { name: "FastPay", logo: "fastpay.svg" }
  - { name: "9Yards Capital" }
  - { name: "True Capital", logo: "true-capital.svg", scale: 0.85 }
  - { name: "Lightdrop", logo: "lightdrop.svg" }

# --- analytics -----------------------------------------------------------
# Paste the GA4 Measurement ID here (looks like G-XXXXXXXXXX) and the tag
# loads on every page. Leave empty and nothing is injected at all — no
# script, no cookie, no consent banner needed.
google_analytics: ""

# Search Console's "HTML tag" verification value — the content="..." string
# only, not the whole meta tag. Can be removed once verified; keeping it
# means re-verification never breaks.
google_site_verification: ""

exclude: [README.md, NOTES.md, Gemfile, Gemfile.lock, vendor]
