<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<link rel="icon" href="/images/logos/favicon.ico" sizes="any" />
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}" />

<title>{% if page.title %}{{ site.title }} | {{ page.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>

<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:title" content="{% if page.title %}{{ site.title }} | {{ page.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}" />
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:image" content="{{ site.url }}{{ page.og_image | default: page.cover | default: page.thumb | default: '/images/thumbnails/Felix_thumbnail.webp' }}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@{{ site.bootstrap_version }}/dist/css/bootstrap.min.css"
      crossorigin="anonymous" />
{% if site.google_site_verification != blank %}
<meta name="google-site-verification" content="{{ site.google_site_verification }}" />
{% endif %}

<!-- Stamped with the build time: Pages caches CSS for 10 minutes, so without
     this a fresh deploy can render new markup against the old stylesheet. -->
<link rel="stylesheet" href="/css/style.css?v={{ site.time | date: '%s' }}" />

{% if site.google_analytics != blank %}
<!-- Google Analytics 4. Only rendered when google_analytics is set in
     _config.yml, so a local build stays clean and nothing is collected
     until the ID is filled in. -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}', { anonymize_ip: true });
</script>
{% endif %}
